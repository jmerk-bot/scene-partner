<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep theatre velvet & warm spotlight backdrop -->
    <radialGradient id="stageBg" cx="50%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#4a1419"/>
      <stop offset="52%" stop-color="#220b0e"/>
      <stop offset="100%" stop-color="#0d0708"/>
    </radialGradient>

    <!-- Overhead stage spotlight -->
    <linearGradient id="spot" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>

    <!-- Gilt Comedy mask & frame gradient -->
    <linearGradient id="giltGold" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="42%" stop-color="#e7b946"/>
      <stop offset="82%" stop-color="#b8841e"/>
      <stop offset="100%" stop-color="#8c5f11"/>
    </linearGradient>

    <!-- Warm ivory-parchment Tragedy mask gradient -->
    <linearGradient id="ivoryMask" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fcf5e3"/>
      <stop offset="58%" stop-color="#e5d2ab"/>
      <stop offset="100%" stop-color="#bda06d"/>
    </linearGradient>

    <!-- Deep mask cutout shadow -->
    <linearGradient id="cutout" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#170709"/>
      <stop offset="100%" stop-color="#311014"/>
    </linearGradient>

    <clipPath id="prosceniumClip">
      <rect x="24" y="24" width="464" height="464" rx="90"/>
    </clipPath>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#stageBg)"/>

  <!-- Clipped Stage Spotlight & Velvet Curtain Drapes -->
  <g clip-path="url(#prosceniumClip)">
    <polygon points="256,18 76,472 436,472" fill="url(#spot)"/>
    <path d="M24 136 Q96 116 142 24 L24 24 Z" fill="#7a1b24" opacity="0.38"/>
    <path d="M488 136 Q416 116 370 24 L488 24 Z" fill="#7a1b24" opacity="0.38"/>
  </g>

  <!-- Proscenium Gold Crest Ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#giltGold)" stroke-width="5" opacity="0.62"/>
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#giltGold)" stroke-width="1.5" opacity="0.28"/>

  <!-- Theatrical Silk Ribbon Flourish -->
  <path d="M96 378 C142 426, 214 434, 256 410 C298 434, 370 426, 416 378" fill="none" stroke="url(#giltGold)" stroke-width="7" stroke-linecap="round" opacity="0.78"/>
  <circle cx="256" cy="410" r="6.5" fill="url(#giltGold)"/>

  <!-- LEFT MASK: TRAGEDY (Melpomene — Ivory & Bronze, tilted -11 deg) -->
  <g transform="translate(184, 246) rotate(-12)">
    <!-- Soft shadow behind Tragedy mask -->
    <path d="M-86 -92 C-52 -118, 52 -118, 86 -92 C94 -20, 74 68, 0 112 C-74 68, -94 -20, -86 -92 Z" fill="#080304" opacity="0.48" transform="translate(-4, 10)"/>
    <!-- Mask shell -->
    <path d="M-86 -92 C-52 -118, 52 -118, 86 -92 C94 -20, 74 68, 0 112 C-74 68, -94 -20, -86 -92 Z" fill="url(#ivoryMask)" stroke="#8c6828" stroke-width="5.5" stroke-linejoin="round"/>
    <!-- Crown & cheek highlight -->
    <path d="M-68 -80 C-36 -98, 36 -98, 68 -80" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    <!-- Sorrowful upturned inner brows -->
    <path d="M-56 -36 Q-32 -40 -16 -56" fill="none" stroke="#4a2e16" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M56 -36 Q32 -40 16 -56" fill="none" stroke="#4a2e16" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Tragic eyes -->
    <path d="M-56 -16 Q-36 -30 -16 -18 Q-36 -4 -56 -16 Z" fill="url(#cutout)"/>
    <path d="M56 -16 Q36 -30 16 -18 Q36 -4 56 -16 Z" fill="url(#cutout)"/>
    <!-- Sculpted nose bridge -->
    <path d="M0 -34 L-7 16 Q0 22 7 16 Z" fill="#b89862" opacity="0.65"/>
    <!-- Classic tragic downturned mouth -->
    <path d="M-40 60 C-24 30, 24 30, 40 60 C22 50, -22 50, -40 60 Z" fill="url(#cutout)"/>
    <path d="M-42 61 C-24 28, 24 28, 42 61" fill="none" stroke="#5c3b1b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- RIGHT MASK: COMEDY (Thalia — Luminous Gilt Gold, tilted +11 deg, overlapping in front) -->
  <g transform="translate(318, 260) rotate(11)">
    <!-- Cast shadow onto Tragedy mask for crisp separation -->
    <path d="M-88 -94 C-54 -120, 54 -120, 88 -94 C96 -18, 76 70, 0 114 C-76 70, -96 -18, -88 -94 Z" fill="#090304" opacity="0.62" transform="translate(-10, 12)"/>
    <!-- Mask shell -->
    <path d="M-88 -94 C-54 -120, 54 -120, 88 -94 C96 -18, 76 70, 0 114 C-76 70, -96 -18, -88 -94 Z" fill="url(#giltGold)" stroke="#fef3c7" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Forehead & cheek luster -->
    <path d="M-68 -82 C-36 -100, 36 -100, 68 -82" fill="none" stroke="#fffbeb" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
    <!-- High joyful arched brows -->
    <path d="M-58 -42 Q-36 -64 -14 -44" fill="none" stroke="#472907" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M14 -44 Q36 -64 58 -42" fill="none" stroke="#472907" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Smiling crescent eyes -->
    <path d="M-56 -18 Q-36 -36 -16 -18 Q-36 -24 -56 -18 Z" fill="url(#cutout)" stroke="#291205" stroke-width="3" stroke-linejoin="round"/>
    <path d="M16 -18 Q36 -36 56 -18 Q36 -24 16 -18 Z" fill="url(#cutout)" stroke="#291205" stroke-width="3" stroke-linejoin="round"/>
    <!-- Sculpted nose bridge -->
    <path d="M0 -30 L-8 14 Q0 20 8 14 Z" fill="#9a6912" opacity="0.55"/>
    <!-- Classic joyous theatre grin -->
    <path d="M-48 28 Q0 42 48 28 C40 72, -40 72, -48 28 Z" fill="url(#cutout)"/>
    <!-- Cheek laugh lines -->
    <path d="M-56 20 Q-62 32 -52 42" fill="none" stroke="#5c3809" stroke-width="4" stroke-linecap="round"/>
    <path d="M56 20 Q62 32 52 42" fill="none" stroke="#5c3809" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
